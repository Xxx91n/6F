<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" width="880" height="560" role="img" aria-label="macro-audit three-layer architecture">
  <rect x="0" y="0" width="880" height="560" rx="24" fill="#0f172a"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">

    <!-- DIST layer -->
    <rect x="60" y="36" width="760" height="140" rx="14" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
    <text x="84" y="68" font-size="17" font-weight="700" fill="#38bdf8">DIST — Agent Plugin five-layer box</text>
    <g font-size="14" fill="#e2e8f0">
      <rect x="84" y="84" width="160" height="66" rx="10" fill="#1e293b" stroke="#475569"/>
      <text x="104" y="110">kernel CLI</text>
      <text x="100" y="132" fill="#94a3b8" font-size="12">macro-audit</text>
      <rect x="260" y="84" width="176" height="66" rx="10" fill="#1e293b" stroke="#475569"/>
      <text x="278" y="110">skills/ shell</text>
      <text x="276" y="132" fill="#94a3b8" font-size="12">methodology, read-only</text>
      <rect x="452" y="84" width="176" height="66" rx="10" fill="#1e293b" stroke="#475569"/>
      <text x="470" y="110">.mcp.json</text>
      <text x="466" y="132" fill="#94a3b8" font-size="12">read-only evidence surface</text>
      <rect x="644" y="84" width="152" height="66" rx="10" fill="#1e293b" stroke="#475569"/>
      <text x="662" y="110">extensions/</text>
      <text x="660" y="132" fill="#94a3b8" font-size="12">hooks layer</text>
    </g>

    <!-- CORE layer -->
    <rect x="60" y="216" width="760" height="140" rx="14" fill="#0f172a" stroke="#f59e0b" stroke-width="2"/>
    <text x="84" y="248" font-size="17" font-weight="700" fill="#f59e0b">CORE — facts &amp; adjudication (moat, self-built)</text>
    <g font-size="14" fill="#e2e8f0">
      <rect x="84" y="264" width="216" height="66" rx="10" fill="#1e293b" stroke="#475569"/>
      <text x="102" y="290">audit_fact (DuckDB)</text>
      <text x="100" y="312" fill="#94a3b8" font-size="12">append-only fact table</text>
      <rect x="316" y="264" width="216" height="66" rx="10" fill="#1e293b" stroke="#475569"/>
      <text x="334" y="290">verdict-gate</text>
      <text x="332" y="312" fill="#94a3b8" font-size="12">federated adjudication</text>
      <rect x="548" y="264" width="248" height="66" rx="10" fill="#1e293b" stroke="#475569"/>
      <text x="566" y="290">Receipt + gates</text>
      <text x="564" y="312" fill="#94a3b8" font-size="12">dual anchors · 3-layer acceptance</text>
    </g>

    <!-- EVID layer -->
    <rect x="60" y="396" width="760" height="140" rx="14" fill="#0f172a" stroke="#38bdf8" stroke-width="2" stroke-dasharray="7 5"/>
    <text x="84" y="428" font-size="17" font-weight="700" fill="#38bdf8">EVIDENCE — upstream components (via adapters)</text>
    <g font-size="14" fill="#e2e8f0">
      <rect x="84" y="444" width="160" height="66" rx="10" fill="#1e293b" stroke="#475569"/>
      <text x="104" y="470">git CLI</text>
      <text x="102" y="492" fill="#94a3b8" font-size="12">active</text>
      <rect x="260" y="444" width="176" height="66" rx="10" fill="#1e293b" stroke="#475569"/>
      <text x="280" y="470">CodeLore</text>
      <text x="278" y="492" fill="#94a3b8" font-size="12">active · probe slices</text>
      <rect x="452" y="444" width="176" height="66" rx="10" fill="#1e293b" stroke="#475569"/>
      <text x="470" y="470">GitHub REST</text>
      <text x="468" y="492" fill="#94a3b8" font-size="12">active · opt-in token</text>
      <rect x="644" y="444" width="152" height="66" rx="10" fill="#1e293b" stroke="#475569" stroke-dasharray="4 4"/>
      <text x="662" y="470">Scorecard</text>
      <text x="660" y="492" fill="#f59e0b" font-size="12">planned</text>
    </g>

    <!-- arrows -->
    <g stroke="#e2e8f0" stroke-width="2" fill="#e2e8f0">
      <line x1="440" y1="396" x2="440" y2="364"/>
      <polygon points="434,370 446,370 440,358"/>
      <line x1="440" y1="216" x2="440" y2="184"/>
      <polygon points="434,190 446,190 440,178"/>
    </g>
    <text x="456" y="388" font-size="12" fill="#94a3b8">adapters only — raw semantics never leaves the adapter layer</text>
    <text x="456" y="208" font-size="12" fill="#94a3b8">consumed by the four shells</text>
  </g>
</svg>
