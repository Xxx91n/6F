name: macro-b-regression

# #46 / D-046 / spec-phase-tasks R7-05 —— 单仓四象限档的回归 CI 搬回 6F 自己的 CI（把 #39 挂在 jiahao 那边的那条回归腿接过来）
#
# 链：resolve（定下要跑哪几个仓）→ engine 装依赖/gen/build → clone 被审的公开仓（URL 明着给、不用 token；
# intake 的隔离纪律 #40：core.hooksPath=noop + protocol.ext.allow=never + 全深度卡浅克隆）
#   → 39-macro-b-one-shot.mjs --repo <name> --root audited-repo --out macro-b-artifacts
# → 工件断言（receipt + sidecar + md + facts + duckdb；test -s 非零字节 + RCP 强断言）→ upload-artifact。
#
# 什么时候跑：schedule（每周一 03:17 UTC，照 #39 的节拍）+ workflow_dispatch（给 repo_url，或者把默认那组重跑一遍）。
# - 不接 push / pull_request：这一面是定时审计回归，不是 PR 关卡（跟 D-034④a 一个规矩）；
# - 已上架层限定：只跑单仓四象限档的 one-shot，预览层不掺进来（D-033 持续回归只管已上架层）；
# - job 绿 = 管线跑通了、工件齐了，不是判定绿——supported/unsupported/insufficient 三档照实写数（反复接受跑不通）；
# - mw-trigger-a 这套说法不变：「单仓四象限档进 CI 定时回归」在 6F 的 CI 形态下照样成立（D-046④），D-043 的判定不受影响；
# - repo_url 只收 https:// 的公开仓（D-013 的输入面）；ssh/file/ext:: 这些协议面一律拒，clone 守 #40 那套隔离；
# - matrix.repo.* 进 run 一律走 env 绕一层（$REPO_URL/$REPO_NAME），堵住 $()/反引号穿进 JSON 注入；
# clone 那条腿对 $REPO_URL 再跑一遍 https-only 的关卡（多一道保险，不信上游 resolve 的输出）；
# - 默认回归集＝jiahao（CI 撤了之后它还是审计对象，不挂我方资产，D-046）；
# T3 那几个经典公开仓，用户定下来之后追加进 resolve job 的 DEFAULT JSON（一个仓一行）。
on:
  schedule:
    - cron: '17 3 * * 1'   # 每周一 03:17 UTC —— 定时回归（D-034④a 触发面）
  workflow_dispatch:
    inputs:
      repo_url:
        description: '被测公开仓 clone URL（https opt-in；留空 = 跑默认回归集）'
        required: false
        default: ''
        type: string
      repo_name:
        description: '被测仓短名（工件命名用；留空 = 从 URL 尾段推导）'
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  resolve:
    name: resolve targets
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - id: set
        env:
          OPT_URL: ${{ inputs.repo_url }}
          OPT_NAME: ${{ inputs.repo_name }}
        run: |
          set -euo pipefail
          # 默认回归集（schedule / dispatch 没填东西时用）：jiahao 加 T3 三个首选的经典公开仓（D-050/#49）——
          # C 族 git/git、Python 族 django/django、Java 族 spring-projects/spring-boot，一个仓一行，matrix 各出一条腿。
          # 备选（超过 20min 预算就换）：C 备 curl/curl、Python 备 pallets/flask、Java 备 apache/kafka。
          DEFAULT='{"repo":[{"name":"jiahao","url":"https://github.com/Xxx91n/jiahao.git"},{"name":"git","url":"https://github.com/git/git.git"},{"name":"django","url":"https://github.com/django/django.git"},{"name":"spring-boot","url":"https://github.com/spring-projects/spring-boot.git"}]}'
          if [ -z "$OPT_URL" ]; then
            echo "matrix=$DEFAULT" >> "$GITHUB_OUTPUT"
            echo "targets = default regression set: $DEFAULT"
            exit 0
          fi
          # URL 明着给的单仓：只收 https:// 的公开仓（ssh/git/file/ext:: 这些协议面不许）
          case "$OPT_URL" in
            https://*) ;;
            *) echo "::error::repo_url 仅允许 https:// 公开仓 clone URL（got: $OPT_URL）"; exit 1 ;;
          esac
          name="$OPT_NAME"
          [ -z "$name" ] && name="$(basename "$OPT_URL" .git)"
          # 工件命名安全：短名归一成 [a-z0-9._-]，去掉头尾的分隔符
          name="$(printf '%s' "$name" | tr 'A-Z' 'a-z' | sed 's/[^a-z0-9._-]/-/g' | sed 's/^[._-]*//;s/[._-]*$//')"
          [ -z "$name" ] && { echo "::error::repo_name 为空且无法从 URL 推导"; exit 1; }
          echo "matrix={\"repo\":[{\"name\":\"$name\",\"url\":\"$OPT_URL\"}]}" >> "$GITHUB_OUTPUT"
          echo "targets = opt-in single: $name <- $OPT_URL"

  macro-b:
    name: macro-b / ${{ matrix.repo.name }}
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve.outputs.matrix) }}
    steps:
      - name: checkout audit engine (self)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0 (node24)
        with:
          path: engine-repo
          fetch-depth: 0          # one-shot 证据锚读仓内文档（docs/spec.md）；全量对象与 #39 先例一致
          # #117 / artipacked：engine 自己这份 checkout 只用来读文档和构建，不写回远端；凭据清掉防泄漏
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0 (node24)
        with:
          node-version: 24   # 对齐 golden-ci 同仓 CI 惯例（engine engines>=22.18 无碍；engine-ci 矩阵另覆盖 22/24）
          cache: npm
          cache-dependency-path: engine-repo/engine/package-lock.json

      - name: build engine
        working-directory: engine-repo/engine
        run: |
          npm ci --ignore-scripts
          npm run gen
          npm run build

      - name: clone audited repo (URL opt-in / intake isolation)
        env:
          REPO_URL: ${{ matrix.repo.url }}
        run: |
          set -euo pipefail
          # 多一道保险：不信上游 resolve 的输出，clone 这条腿再跑一遍 https-only 关卡
          case "$REPO_URL" in
            https://*) ;;
            *) echo "::error::repo url 仅允许 https://（got: $REPO_URL）"; exit 1 ;;
          esac
          mkdir -p .clone-noop-hooks
          # #113 返修（PR #127 审查）：这条腿**不**加 `-c core.symlinks=false`。加了会把被审仓里的符号链接
          # 物化成「内容是目标路径那串字的普通文件」——`readRepoFileSafe` 只认 lstat 看到的事实，普通文件就放行，
          # 于是指到仓外的链接被当成 ADR 正文解析了，而且**不会**产生 `codelore.file_subject_skip` 那条说明事实：
          # 既改了 ADR 语料，又把这张票要证明的「拒掉＋说明」那条路整段盖住。链接该怎么写就怎么写，安全边界交给读取那一处兜。
          # `core.symlinks=false` 该用力的地方＝url 那条腿的真克隆（engine/src/intake/intake.ts，
          # 效果有 engine/test/contracts/113-check.mjs 的 A5 静态盯着）；workflow_dispatch 随便来个 https:// 输入
          # 也走那同一条腿，所以这条腿不再挂同一个旗标。
          git -c core.hooksPath="$GITHUB_WORKSPACE/.clone-noop-hooks" \
              -c protocol.ext.allow=never \
              clone "$REPO_URL" audited-repo
          # 卡浅克隆的断言（跟 engine/src/intake/intake.ts 的 SHALLOW-CLONE-REJECTED 一个路子：拉全了才让进）
          test "$(git -C audited-repo rev-parse --is-shallow-repository)" = "false"
          # 链接可见性前置断言（#113）：克隆下来必须**留着**符号链接，不然这次 CI 的回归面压根测不到安全读取那一处。
          # 没有链接的普通仓不会触发（不等于 0 就是没链接，不算失败）。
          symlinks_seen="$(git -C audited-repo ls-files -s | awk '$1 == "120000"' | wc -l)"
          echo "audited-repo symlink entries: $symlinks_seen（保留原始链接=安全读取单点仍被回归覆盖）"

      - name: Macro-B one-shot regression (exit-code aware; expected-divergence branch)
        id: oneshot
        env:
          REPO_NAME: ${{ matrix.repo.name }}
          MACRO_AUDIT_STRICT_QUARANTINE: '0'
        run: |
          set +e
          node engine-repo/engine/scripts/39-macro-b-one-shot.mjs \
            --repo "$REPO_NAME" \
            --root "$GITHUB_WORKSPACE/audited-repo" \
            --out "$GITHUB_WORKSPACE/macro-b-artifacts"
          rc=$?
          set -e
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          # #78/D-118①＋r29 审计 F4 裁定（选的是①）：对照物没有隔离桶——病态对象解析失败＝预期分歧格；
          # 协议崩（exit 2）+ crash 工件在＝绿（证据先摆出来，不是跑通了，也不是把错咽了）；其余非零 / 崩了又没工件＝真红
          if [ "$rc" -ne 0 ]; then
            if [ "$rc" -eq 2 ] && ls macro-b-artifacts/*crash*.json >/dev/null 2>&1; then
              echo "::warning::one-shot 协议崩溃（预期分歧格，D-118①）——39-crash 工件已留证"
            else
              echo "::error::非零退出 rc=$rc 且非「协议崩+工件在」格——真失败非预期分歧"
              exit 1
            fi
          fi

      - name: "verify report artifacts (three-check: present + JSON parse + verdict/reason_class enum + intake_health)"
        if: steps.oneshot.outputs.rc == '0'
        env:
          REPO_NAME: ${{ matrix.repo.name }}
        run: |
          set -euo pipefail
          test -s "macro-b-artifacts/39-macro-b-$REPO_NAME.json"
          grep -Eq '"receipt_id"[[:space:]]*:[[:space:]]*"RCP-[0-9a-f]{16}"' "macro-b-artifacts/39-macro-b-$REPO_NAME.json"
          grep -q '"scale": "Macro-B"' "macro-b-artifacts/39-macro-b-$REPO_NAME.json"
          test -s "macro-b-artifacts/39-macro-b-$REPO_NAME.md"
          test -s "macro-b-artifacts/39-macro-b-$REPO_NAME-facts.jsonl"
          test -s "macro-b-artifacts/39-macro-b-$REPO_NAME-measurements.json"
          test -s "macro-b-artifacts/39-audit-facts.duckdb"
          # #78 三查升级（协议级当场停 / 字段级隔离）：①sidecar 的 JSON 能解析 ②overall_verdict 和 verdict.reason_class 落在闭集里 ③intake_health 一直在
          node -e "const s=require('./macro-b-artifacts/39-macro-b-$REPO_NAME.json'); if(['supported','unsupported','insufficient'].indexOf(s.overall_verdict)<0) throw new Error('overall_verdict not in enum: '+s.overall_verdict); if(!s.verdict||['none','evidence_insufficient','anchor_malformed','threshold_exceeded','criteria_unsupported'].indexOf(s.verdict.reason_class)<0) throw new Error('reason_class not in enum: '+(s.verdict&&s.verdict.reason_class)); if(!s.intake_health||!Array.isArray(s.intake_health.fields)) throw new Error('intake_health absent');"
          grep -q '## Intake Health' "macro-b-artifacts/39-macro-b-$REPO_NAME.md"
          echo "macro-b regression verified: artifacts + JSON + verdict/reason_class enum + intake_health (pipeline green != verdict green)"

      - name: verify crash artifact (expected-divergence branch)
        # #78/D-118① r29 审计 F4 裁定①：协议崩这条腿按「工件 schema=v1 加 error_code 在受控表里」验绿——红了说明「解析失败格」的证据缺了，不是免死金牌
        if: steps.oneshot.outputs.rc != '0'
        run: |
          set -euo pipefail
          ls macro-b-artifacts/*crash*.json
          node -e "const fs=require('fs');const f=fs.readdirSync('macro-b-artifacts').filter(x=>x.indexOf('crash')>=0);const j=JSON.parse(fs.readFileSync('macro-b-artifacts/'+f[0],'utf8'));if(j.schema!=='quarantine-crash-artifact/v1')throw new Error('crash schema!=v1');if(typeof j.error_code!=='string'||!j.error_code)throw new Error('error_code absent');console.log('expected-divergence green:',j.error_code)"

      - name: upload crash artifacts (protocol-bucket lane, if any)
        # #78/D-109：协议级崩溃固定出 schema 工件——one-shot 硬崩（exit 2/3）时崩溃桶的 JSON 跟着工件一起传，批灭之前先留证（actions/upload-artifact@v4）
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 (node24)
        with:
          name: macro-b-crash-${{ matrix.repo.name }}
          path: macro-b-artifacts/*crash*.json
          if-no-files-found: ignore

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 (node24)
        if: always()
        with:
          name: macro-b-${{ matrix.repo.name }}-${{ github.run_id }}
          path: macro-b-artifacts/
          if-no-files-found: warn
