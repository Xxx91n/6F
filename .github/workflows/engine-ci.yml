name: engine-ci
on:
  push:
    paths:
      - "engine/**"
      - ".github/workflows/engine-ci.yml"
  pull_request:
    paths:
      - "engine/**"
      - ".github/workflows/engine-ci.yml"
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm run gen
      - run: npm run build
      - name: rebuild-diff guard (D-067 dist committed — src/dist drift fails)
        shell: bash
        run: test -z "$(git status --porcelain -- dist/)" || (echo "DIST-DRIFT: dist/ 与 src 失同步——本地 npm run build 后同 commit 提交 dist/"; git status --porcelain -- dist/; exit 1)
      - run: npm run package
      - run: npm run smoke
      # #58/D-066 真校验器 advisory：`claude plugin validate --strict`（WARN 不红；cli-absent=SKIP 非失败）
      # 双触发之一=CI event_bound（manifest.meta.json/gen-manifests.mjs 变更随 engine/** 路径触发即含）；
      # 双触发之二=pack/marketplace 前置手动窗口 npm run validate:plugin；转 enforce 判据=registry claude-validate-promotion-watch
      - name: claude plugin validate (advisory)
        shell: bash
        working-directory: engine
        run: node scripts/validate-plugin.mjs
