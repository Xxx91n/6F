name: engine-ci
on:
  push:
    paths:
      - "engine/**"
      - ".github/workflows/engine-ci.yml"
  pull_request:
    paths:
      - "engine/**"
      - ".github/workflows/engine-ci.yml"
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm run gen
      - run: npm run build
      # #82/D-129③：棘轮断言挂 rebuild-diff 同链＋check-dist.yml 式两减痛件
      # （--ignore-space-at-eol 容忍行尾空白差；失败时 upload-artifact 供异地复核）
      - name: rebuild-diff guard (D-067 dist committed — src/dist drift fails)
        id: rebuilddiff
        shell: bash
        run: |
          node scripts/check-dist.mjs
          untracked="$(git ls-files --others --exclude-standard -- dist/)"
          drift="$(git diff --ignore-space-at-eol --name-only -- dist/)"
          if [ -n "$untracked" ] || [ -n "$drift" ]; then
            echo "DIST-DRIFT: dist/ 与 src 失同步——本地 npm run build 后同 commit 提交 dist/（行尾空白差已容忍，实差异如下）"
            git status --porcelain -- dist/
            git diff --ignore-space-at-eol -- dist/ | head -200
            exit 1
          fi
      - name: upload dist on rebuild-diff failure
        # #83/F7j：job 级 failure() 收窄为步级 outcome——仅 rebuild-diff 守卫本身失败才传 dist（前步失败不再触发上传）
        if: steps.rebuilddiff.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: dist-drift-${{ matrix.os }}-node${{ matrix.node }}
          path: engine/dist/
          retention-days: 7
      - run: npm run package
      - run: npm run smoke
      # #58/D-066 真校验器 advisory：`claude plugin validate --strict`（WARN 不红；cli-absent=SKIP 非失败）
      # 双触发之一=CI event_bound（manifest.meta.json/gen-manifests.mjs 变更随 engine/** 路径触发即含）；
      # 双触发之二=pack/marketplace 前置手动窗口 npm run validate:plugin；转 enforce 判据=registry claude-validate-promotion-watch
      - name: claude plugin validate (advisory)
        shell: bash
        working-directory: engine
        env:
          MACRO_AUDIT_CI: '1'
        run: node scripts/validate-plugin.mjs
      # #64/D-072③ 自愈双腿：offline-sim（死 registry 三段回落断言）＋干净机 E2E smoke（真补拉→openWriter 读写）
      - name: duckdb self-heal offline-sim
        shell: bash
        working-directory: engine
        run: node test/duckdb-selfheal-offline.test.mjs
      - name: duckdb self-heal E2E
        shell: bash
        working-directory: engine
        run: node test/duckdb-selfheal-e2e.test.mjs

      - name: duckdb doctor --fix e2e
        shell: bash
        working-directory: engine
        run: node test/doctor-fix.test.mjs

      - name: 78-check quarantine 独立对账守卫（D-116② load-bearing：独立代码路径恒等式重算）
        shell: bash
        run: node .scratch/architecture-recovery/reports/78-check.mjs
