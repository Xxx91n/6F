name: engine-ci
on:
  push:
    paths:
      - "engine/**"
  pull_request:
    paths:
      - "engine/**"
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm install
      - run: npm run gen
      - run: npm run build
      - run: npm run package
      - run: npm run smoke
