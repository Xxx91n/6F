# baseline-lock.yaml — 基准语料锁定表（机读权威 / single source of truth）
# 制度来源：ADR-0026（基准语料自持）＋ #33 落盘；与 upstream-lock.yaml（产品上游）分册——基准语料不是产品上游。
#
# 为什么分册（#32 根因）：upstream-lock.yaml 的 status 枚举（active/planned/evaluating/retired）与
#   README 致谢面闭账（gen-acknowledgments.mjs TEMPLATES 双向差集，77-check A2/A3 enforce）是「产品上游」语义；
#   基准语料是「被审计的同级基准仓」，生命周期与上游锁不同。旧表用 status=planned 承载一枚已生效消费的钉＝枚举位妥协，
#   本表以 status=active 直言其已生效态，不再借位。
#
# 字段契约：**正文只在 docs/versioning.md §3「基准语料分册」那一处**（本表只填值不复制规则，同 upstream-lock 口径）：
#   id / kind / version / pin_type / status / contract / adapter / materialization /
#   bundle / bundle_bytes / bundle_sha256 / last_reviewed / next_review；另加复审留痕字段 review_evidence
#   （非契约面字段，值=一行散文实跑读数，口径同 upstream-lock 的 review_evidence）。
#   kind 词表：repo-corpus（被审计仓的语料快照；后续新增基准按此登记）
#   status 词表：active（已被守卫实跑消费）／retired（不再消费，行不删以留溯源）
#   三元钉：version（提交 sha）＋bundle_sha256（制品哈希）＋bundle_bytes（制品字节）——三者须同窗更新，
#     85-check A11 机检字节数与 sha256，C-GATE 机检 list-heads 唯一项与空仓 verify（带 prerequisite 即红），
#     C0 机检物化后 HEAD 与钉值同值。
#   复审节奏同 §4：next_review=手动窗口到期日（每 release 前或 ≤30 天先到者）。
#
# 分发面：本表**不随 tgz**（engine/package.json files 无此条目）——消费方是仓内守卫，语料 bundle 在
#   engine/test/fixtures/frozen/（测试夹具，不入包）；把锁表打进包只会留下一条指向包外制品的悬空锚。
#   与 upstream-lock.yaml 入包（44-check A13，provenance 锚随 tgz）的分野即在此：产品上游随报告走，基准语料不随。
#
# 消费纪律（D-074 边界）：守卫运行期只 `git clone <bundle>` 至 OS 临时目录，主仓对象库零写；
#   禁 unbundle 进主仓、禁 fetch 写主仓 objects、禁引用任何同级仓工作树（#33 解掉的正是这条 sibling 前提）。
#   活跃路径（本表＋85-check＋报告输出）不得出现本机绝对路径（#34 可移植性前提，85-check A12 机检）。
#
# 换钉流程（手动窗口）：重打 bundle（HEAD 指向新钉提交的全历史自足包）→ 同步改本行 version／bundle_bytes／
#   bundle_sha256 三值 → 重跑 85-check C 组 C0~C6 值级全等断言 → 记录 review_evidence。禁改钉而不改制品哈希。
lock_version: 1
baselines:
  - id: anysearch-cli-adr-corpus
    kind: repo-corpus
    version: "770d25495a67bb1e6b1c421a9b40c04259950ddf"
    pin_type: commit-sha
    status: active
    contract: "Macro-C 差分重校准基准语料＝anysearch-cli 在 770d2549 时点的仓快照（ADR 删除提交的父提交，2026-10-22；tree 含 docs/adr/*.md 104 件，全历史 822 提交）；pin 已定版（pin_type=commit-sha，禁 range/浮动 HEAD）；语料自持=仓内 frozen bundle 全历史自足包，HEAD 指向该钉，clone 即得冻结面（无 prerequisite、零联网、零 sibling）；唯一权威=本行三元钉（version＋bundle_sha256＋bundle_bytes）；C 组消费面=head_sha/commit_count/adr_count/adr_date_resolvable/lag_judgeable_n/adr_leg_distribution/supersede_chain 七项值级全等＋chainFact fact_id 全等（engine 面 vs 38 编排层独立重算，非 golden 手抄）"
    adapter: "engine/test/contracts/85-check.mjs C 组（baselineRow('anysearch-cli-adr-corpus')→AS_PIN_SHA→git clone <bundle>）"
    materialization: "frozen-bundle"
    bundle: "engine/test/fixtures/frozen/anysearch-cli-770d2549.bundle"
    bundle_bytes: 14961055
    bundle_sha256: "6624a2dcfbcdecd828e03c8359d564d8e9a7204d66fdfffff06dd6a0a13bb1ce"
    last_reviewed: 2026-10-26
    next_review: 2026-11-25
    review_evidence: "#33 2026-10-26 实跑：`git bundle list-heads`＝770d2549… HEAD 唯一位；`git bundle verify` 自证完整（零 prerequisite）；clone 至 OS temp 后 rev-parse HEAD＝770d2549…、rev-list --count=822、docs/adr/*.md=104 件；`GUARD_SIBLING_ROOT=/tmp/__no_sibling__ node test/contracts/85-check.mjs` → PASS 41/41、118s、SKIP-GROUPS 零（C 组不再依赖任何同级仓）。制品体量实测 14961055B（14.3 MiB）——ADR-0026 原记「实测 144KB」系 ADR 语料 gzip 量级误记，勘误见该 ADR 后果段"
