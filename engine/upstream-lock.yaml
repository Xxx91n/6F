# upstream-lock.yaml — 上游版本锁定表（机读权威 / single source of truth）
# 制度来源：D-037（轮 7 Q1 拍板）＋ ADR-0018 §D-1 ＋ docs/versioning.md §3；票 #44 / A-049 落盘
#
# 字段契约（D-037③ 逐字）：id / kind / version / pin_type(exact-version|commit-sha|digest|api-version※) /
#   contract / status(active|planned|evaluating|retired) / adapter / last_reviewed / next_review
#   kind 词表（随接入面扩展登记）：external-cli / node-lib / go-lib-or-cli / cli-or-pip / data-export / remote-api（D-048，#47）
#   ※api-version 由 #47/D-048 remote-api 行引入（X-GitHub-Api-Version 头 pin，非制品版本）
#
# 锁定纪律（docs/versioning.md §3-4 同源）：
#   - 本表为唯一机读权威——README §3 上游清单表是人读形态，状态列与本表 status 同源
#     （已接入=active / 规划中=planned / 评估中=evaluating；retired 行不在 README 表）。
#   - 锁定表先于依赖存在：未在本表登记的上游禁止接入；planned 行登记目标契约。
#   - retired 行不删：旧报告 provenance 锚须可反查（报告头锁定表快照 hash 见 versioning.md §2）。
#   - 禁 range / 浮动 tag / latest：version 一律 exact pin；planned/evaluating 行 version=null
#     待接入窗口定版（接入前必须先定 pin_type+version 并补 golden 契约）。
#   - 更新走手动窗口（每 release 前一次）＋全量 golden 回归护航；禁 Renovate 式自动升级
#     （detector 版本变化 = 审计口径变更，D-037④）。
#   - next_review = 手动窗口到期日（每 release 前或 ≤30 天先到者）；逾期由
#     .scratch/architecture-recovery/reports/44-check.mjs 新鲜度断言报警（advisory 段）。
lock_version: 1
upstreams:
  - id: codelore
    kind: external-cli
    version: "0.28.0"
    pin_type: exact-version
    contract: "binary-discovery：PATH 解析 codelore 二进制＋`codelore --version` 输出必须恰等于 pin 值；不等即拒跑降级、不静默换版本（版本断言=44-check.mjs B 组实跑三方同值：binary↔本表↔CODELORE_PINNED_VERSION）"
    status: active
    adapter: "engine/src/upstream/codelore.ts（CODELORE_ADAPTER_ID=codelore-adapter@v1，CODELORE_PINNED_VERSION 常量同源）"
    last_reviewed: 2026-09-16
    next_review: 2026-10-16
  - id: duckdb-node-api
    kind: node-lib
    version: "1.5.5-r.4"
    pin_type: exact-version
    contract: "package.json dependencies 精确值（无 ^/~ 前缀）＋package-lock.json hash 锁定；事实表底座组件，非 upstream/ 适配层对象"
    status: active
    adapter: "engine/src/fact/store.ts（audit_fact 事实表写路径基座）"
    last_reviewed: 2026-09-16
    next_review: 2026-10-16
  - id: git-cli
    kind: external-cli
    version: null
    pin_type: null
    contract: "随宿主环境不 pin 版本（README §3/D-020 双轨制）——契约面=冻结 argv＋输出形状解析断言＋golden 契约测试；版本漂移经契约测试检出而非版本 pin。enforce 位=engine/src/intake/intake.ts normalizeGitIsoDate（%cI 归一化 +00:00→Z＋严格 ISO 形状断言 GITCLI-OUTPUT-CONTRACT，#54/D-059①：git<2.45 吐 +00:00、≥2.45 吐 Z 的版本拼写漂移在解析边界归一）；单测=engine/test/gitcli-contract.test.mjs"
    status: active
    adapter: "engine/src/collect/＋engine/src/intake/（git 子进程调用面）"
    last_reviewed: 2026-09-16
    next_review: 2026-10-16
  - id: openssf-scorecard
    kind: go-lib-or-cli
    version: null
    pin_type: null
    contract: "供应链健康评分（README §3 行）。接入形态未定：库→依赖引用走 lockfile hash pinning／CLI→适配器 exact pin。接入前须先定 pin_type+version 并补 golden 契约；禁 range/浮动 tag。拉动票=#42 上游队列"
    status: planned
    adapter: null
    last_reviewed: 2026-09-16
    next_review: 2026-10-16
  - id: repomix-gitingest
    kind: cli-or-pip
    version: null
    pin_type: null
    contract: "（已退役 D-056）原用途=仓库内容打包摘要喂 LLM 叙事层——宿主 agent 恒在（ADR-0016）＋叙事面=宿主 agent 经 MCP 读 facts（D-053）抽空原用途；repomix 官方已 MCP 化按需查询、D-050 目标仓全超 ~10k 文件上限。repo 文件面由宿主 agent 原生访问承担，产品不提供 repo 文本打包面。属 D-045 判据「无价值」分支（消费前提结构性消失≠可算但暂缓面），非弃用从严破例。重开触发器=registry repomix-reopen-trigger"
    status: retired
    adapter: null
    risk_note: "retired 行不删、provenance 可反查（D-037③/ADR-0018）；重开条件=审计证据导出包/Macro-A 跨仓打包实证需求出现→另立需求票重评估，接入仍须先定 pin＋golden 契约"
    last_reviewed: 2026-09-17
    next_review: 2027-09-17
  - id: codelore-sqlite-dump
    kind: data-export
    version: null
    pin_type: null
    contract: "CodeLore sqlite dump 对照评估（#42 上游队列拉动）。首轮对照评估已落文=reports/42-dump-comparison.md，呈报结论=维持逐面契约路径不采纳为事实输入面；采纳须另立 ADR 并先定 pin（exact-version 或 digest）；评估期禁止接入事实链/verdict 输入面"
    status: evaluating
    adapter: null
    risk_note: "dump 格式随 codelore 版本漂移——若采纳将成为审计口径输入面；首轮评估（42-dump-comparison.md）三轴裁定：契约字段覆盖 0/30 层级错位／语义翻译面爆炸须复刻上游分析引擎（结构性违反 ADR-0014）／golden 只能钉内部 schema_v8 非契约面；dump 合法域=诊断调研原料不进 verdict 输入；采纳前置=ADR 拍板＋pin 落定＋golden 回归"
    last_reviewed: 2026-09-16
    next_review: 2026-10-16
  - id: github-rest
    kind: remote-api
    version: "2022-11-28"
    pin_type: api-version
    contract: "Micro-A PR 数据面（D-048／#47）：PR 枚举（含平台声明 Bot 判读=user.type==Bot+[bot] 后缀双检）＋PR 元数据＋diff 兜底（本地 git base...head 优先，API diff 仅在 base/head 本地缺席时使用）；X-GitHub-Api-Version 头 pin；限流=读 x-ratelimit-* 头＋Retry-After＋余额写事实库，耗尽即确定性降级/停止；凭据三级探测=GITHUB_TOKEN env→gh 已认证态只读借用（可选优化非依赖）→无认证显式降级；不建凭据存储、不引 OAuth；raw 上游响应不出适配器边界（ADR-0014）；review/comment 面=planned 不入 Micro-A 最小契约"
    status: active
    adapter: "engine/src/upstream/github-rest.ts（GITHUB_REST_ADAPTER_ID=github-rest-adapter@v1，API 版本常量 GITHUB_API_VERSION 同源）"
    last_reviewed: 2026-09-16
    next_review: 2026-10-16
